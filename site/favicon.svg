<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Solid Pure Black Rounded Base (Visible across light, dark, and neutral browser tabs) -->
  <rect width="32" height="32" rx="7" fill="#0A0A0A" stroke="#222220" stroke-width="0.8"/>
  <g transform="translate(1, 0)">
    <!-- Grass Leaf Blade on Left -->
    <path d="M 12 7 C 7 13 7 21 11 25 C 13.5 19 13.5 13 12 7 Z" fill="#3DA768"/>
    <!-- Git Branching Tree on Right with Donut Nodes -->
    <path d="M 15 8.5 L 16 23.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 15.5 14 Q 18 15 22 15" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 15.8 18 Q 18.5 19 21.5 20.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    
    <!-- Top Donut Node -->
    <circle cx="15" cy="8.5" r="2.8" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1.8"/>
    <!-- Middle Right Donut Node -->
    <circle cx="22" cy="15" r="2.5" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1.8"/>
    <!-- Lower Right Donut Node -->
    <circle cx="21.5" cy="20.5" r="2.5" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1.8"/>
    <!-- Bottom Donut Node -->
    <circle cx="16" cy="23.5" r="2.8" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1.8"/>
  </g>
</svg>